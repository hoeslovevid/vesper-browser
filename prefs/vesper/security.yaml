# Keep malware/phishing lists. Do not send downloaded-file hashes to Google.
- name: browser.safebrowsing.malware.enabled
  value: true

- name: browser.safebrowsing.phishing.enabled
  value: true

- name: browser.safebrowsing.downloads.enabled
  value: true

- name: browser.safebrowsing.downloads.remote.enabled
  value: false

# AMO-signed Firefox extensions stay required for the public build.
- name: xpinstall.whitelist.required
  value: true

# Do not send crash reports automatically
- name: browser.crashReports.unsubmittedCheck.enabled
  value: false

- name: toolkit.coverage.enabled
  value: false
