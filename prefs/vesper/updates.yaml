- name: vesper.updates.enabled
  value: true

- name: vesper.updates.github-repo
  value: "hoeslovevid/vesper-browser"

- name: vesper.updates.check-interval-seconds
  value: 86400

- name: vesper.updates.last-check
  value: 0

- name: vesper.updates.last-notified-tag
  value: ""

- name: vesper.updates.include-prerelease
  value: false

- name: vesper.updates.current-version
  value: "0.1.2"

# Do not query Zen's MAR server in the background.
- name: app.update.staging.enabled
  value: false

- name: app.update.service.enabled
  value: false
